          type:
            - string
            - "null"
          format: date
          description: Für jedes Board-Mitglied schreibbar, sofern das Feld am Board aktiviert ist.
        transferDate:
          type:
            - string
            - "null"
          format: date
          description: Für jedes Board-Mitglied schreibbar, sofern das Feld am Board aktiviert ist.
        requestedAmountCents:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 2000000000
        approvedAmountCents:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 2000000000
        actualAmountCents:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 2000000000
        notes:
          type:
            - string
            - "null"
          maxLength: 20000
        applicantNote:
          type:
            - string
            - "null"
          maxLength: 20000
        archived:
          type: boolean
          description: Nur `false` (Wiederherstellen) ist zulässig; `true` wird mit `400` abgelehnt.
