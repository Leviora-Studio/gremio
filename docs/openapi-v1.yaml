        accountId:
          type:
            - integer
            - "null"
          format: int32
        assigneeUserIds:
          type: array
          items:
            type: integer
            format: int32
        creatorUserId:
          type:
            - integer
            - "null"
          format: int32
        deadline:
          type:
            - string
            - "null"
          format: date
        meeting:
          type:
            - string
            - "null"
          format: date
