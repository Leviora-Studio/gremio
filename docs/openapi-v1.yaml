        - boardId
        - statusId
        - position
        - title
        - locationId
        - archivedAt
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          format: int32
        boardId:
          type: integer
          format: int32
        statusId:
          type: integer
          format: int32
        statusName:
          type: string
        boardName:
          type: string
          description: Nur bei `GET /cards/{id}` und `GET /me/cards`.
        position:
          type: integer
          format: int32
        title:
          type: string
        locationId:
          type:
