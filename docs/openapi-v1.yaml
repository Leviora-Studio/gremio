              - budget_title
              - requested_amount
              - approved_amount
              - actual_amount
              - creator
              - assignee
              - deadline
              - meeting
              - decision_ref
              - instruction_date
              - transfer_date
              - priority
              - account
              - finance_request
              - annex_a
              - annex_b
              - student_card
              - other_pdfs
              - notes
              - applicant_note
    Card:
      type: object
      description: Karte. **Optionale Felder erscheinen nur, wenn sie am Board aktiviert sind** — die
        Liste unten zeigt alle möglichen. Beträge sind Integer in **Cent**, Datumsfelder
        `YYYY-MM-DD`.
      required:
