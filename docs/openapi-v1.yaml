      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        position:
          type: integer
          format: int32
        isArchiveTrigger:
          type: boolean
          description: Erreicht eine Karte diese Spalte, greift die Nextcloud-Archivierung.
        isInstructionTrigger:
          type: boolean
          description: Setzt beim Erreichen das Anweisungsdatum. Nur für Board-Verwalter enthalten.
        isTransferTrigger:
          type: boolean
          description: Setzt beim Erreichen das Überweisungsdatum. Nur für Board-Verwalter enthalten.
        isReceiptTrigger:
          type: boolean
          description: Quittungs-Quellspalte; mehrere erlaubt. Benötigt receiptToStatusId, Archiv-Sperre hat
            Vorrang. Nur für Board-Verwalter enthalten.
    BoardDetail:
      type: object
      required:
        - board
        - statuses
        - visibleFields
      properties:
        board:
          $ref: "#/components/schemas/Board"
        statuses:
          type: array
          items:
            $ref: "#/components/schemas/BoardStatus"
        visibleFields:
          type: array
          description: Am Board aktivierte Kartenfelder. Nicht enthaltene Felder werden weder gelesen noch
