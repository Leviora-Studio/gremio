# GENERIERT — nicht von Hand bearbeiten.
# Quelle: lib/openapi-v1.ts · neu erzeugen mit `npm run openapi:yaml`
openapi: 3.1.0
info:
  title: Gremio Internal API
  version: 1.0.0
  summary: Token-geschützte API für Boards und Karten.
  description: >-
    Interne REST-API von Gremio für **eigene Werkzeuge und Integrationen**.


    Alle Endpunkte verlangen einen persönlichen API-Token:


    ```

    Authorization: Bearer grm_…

    ```


    Tokens werden unter **Mein Konto → API-Tokens** (`/intern/konto`) erstellt. Ein Token ist an
    **einen Nutzer** gebunden und erbt dessen Rechte — er ist **keine** pauschale
    Administratorberechtigung.


    **Rechtestufe (`scope`)**: `write` erlaubt lesende und schreibende Zugriffe, `read` nur `GET`
    (sonst `403`).


    **Board-Beschränkung**: Ein Token kann auf bestimmte Boards begrenzt werden. Die Beschränkung
    wirkt **zusätzlich** zur Live-Zugriffsprüfung des Nutzers und kann nur einschränken, nie
    erweitern. Nicht erlaubte Boards verhalten sich wie nicht vorhanden (`404`).


    **Diese Dokumentation und die Spezifikation sind selbst anmeldepflichtig** (Gremio-Web-Session).
    Die Anmeldung dient nur dem Öffnen der Doku — für „Try it out" wird zusätzlich ein API-Token
    über **Authorize** benötigt, und die aufgerufene Route prüft ihn unabhängig davon erneut.


    Die **öffentliche** API für native Apps ist getrennt dokumentiert unter `/api/public/docs`.
  license:
    name: AGPL-3.0-only
servers:
  - url: /
    description: Diese Instanz
tags:
  - name: Allgemein
    description: Token prüfen und Endpunkte entdecken.
  - name: Boards
    description: Zugängliche Boards, Spalten und Feldkonfiguration.
  - name: Karten
    description: Karten lesen, anlegen, ändern, verschieben und löschen.
security:
  - BearerAuth: []
paths:
  /api/v1/cards:
    get:
      tags:
        - Karten
      operationId: searchCards
      summary: Karten boardübergreifend suchen
      description: Only live accessible and token-allowed boards. Always paginated. Hidden fields cannot
        match searches, filters or deadline sorting. accountId also matches budget positions.
        Unknown query parameters return 400.
      parameters: &a21
        - &a3
          name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - &a4
          name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
        - &a8
          name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
          description: Literal substring search (case-insensitive) in title and visible number, applicant,
            notes and budget title; % and _ are literal.
        - &a9
          name: boardId
          in: query
          required: false
          schema: &a1
            type: integer
            minimum: 1
            maximum: 2147483647
        - name: statusId
          in: query
          required: false
          schema: *a1
        - &a10
          name: priorityId
          in: query
          required: false
          schema: *a1
        - &a11
          name: accountId
          in: query
          required: false
          schema: *a1
        - &a12
          name: assigneeUserId
          in: query
          required: false
          schema: *a1
        - name: archived
          in: query
          required: false
          schema:
            type: string
            enum:
              - "false"
              - "true"
              - all
            default: "false"
        - &a13
          name: unassigned
          in: query
          required: false
          schema:
            type: boolean
        - &a14
          name: overdue
          in: query
          required: false
          schema:
            type: boolean
          description: Deadline before today's date in Europe/Berlin, not in the board's done column and not
            archived. Hidden deadlines never match.
        - &a15
          name: deadlineBefore
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Exclusive upper bound.
        - &a16
          name: deadlineAfter
          in: query
          required: false
          schema:
            type: string
            format: date
          description: Exclusive lower bound.
        - &a17
          name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - position
              - updated
              - deadline
            default: position
          description: Position ascending, updated descending, or visible deadline ascending with nulls last.
            Stable ID tie-breaker.
      responses:
        "200":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
        "400": &a2
          description: Ungültige Eingabe, fehlende Berechtigung oder nicht gefunden.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
  /api/v1/boards/{id}/users:
    get:
      tags:
        - Boards
      operationId: listAssignableUsers
      summary: Zuweisbare Nutzer nachschlagen
      description: Requires visible assignee or creator field. Only active users with board access; no
        email, avatar paths or credentials.
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - *a3
        - *a4
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                  - pagination
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - username
                        - name
                      properties:
                        id: *a1
                        username:
                          type: string
                        name:
                          type:
                            - string
                            - "null"
                  pagination: &a5
                    type: object
                    required:
                      - limit
                      - offset
                      - hasMore
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      hasMore:
                        type: boolean
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
  /api/v1/boards/{id}/accounts:
    get:
      tags:
        - Boards
      operationId: listBoardAccounts
      summary: Kontenauswahl nachschlagen
      description: Requires enabled account field. Returns the shared selectable catalog, not balances or
        finance-board data.
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accounts
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: *a1
                        name:
                          type: string
                        position:
                          type: integer
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
  /api/v1/boards/{id}/priorities:
    get:
      tags:
        - Boards
      operationId: listBoardPriorities
      summary: Prioritäten nachschlagen
      description: Requires enabled priority field.
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                required:
                  - priorities
                properties:
                  priorities:
                    type: array
                    items:
                      type: object
                      properties:
                        id: *a1
                        label:
                          type: string
                        color:
                          type: string
                        position:
                          type: integer
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
  /api/v1/cards/{id}/comments:
    get:
      tags:
        - Kommentare
      operationId: listCardComments
      summary: Kommentare lesen
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - *a3
        - *a4
      responses:
        "200":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                required:
                  - comments
                  - pagination
                properties:
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                  pagination: *a5
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
    post:
      tags:
        - Kommentare
      operationId: addCardComment
      summary: Kommentar hinzufügen
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema: &a6
              type: object
              additionalProperties: false
              required:
                - body
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 5000
      responses:
        "201":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                required:
                  - comment
                properties:
                  comment:
                    $ref: "#/components/schemas/Comment"
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
  /api/v1/cards/{id}/comments/{commentId}:
    patch:
      tags:
        - Kommentare
      operationId: editCardComment
      summary: Eigenen Kommentar bearbeiten
      description: Author only, even for administrators. Requires write scope. Does not change the
        original creation time.
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - name: commentId
          in: path
          required: true
          schema: *a1
      requestBody:
        required: true
        content:
          application/json:
            schema: *a6
      responses:
        "200":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                required:
                  - comment
                properties:
                  comment:
                    $ref: "#/components/schemas/Comment"
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
    delete:
      tags:
        - Kommentare
      operationId: deleteCardComment
      summary: Kommentar löschen
      description: Author or board manager, plus write scope.
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - name: commentId
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    const: true
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
  /api/v1/cards/{id}/activity:
    get:
      tags:
        - Karten
      operationId: listCardActivity
      summary: Unveränderlichen Aktivitätsverlauf lesen
      description: Newest first. Hidden assignment/deadline details are null. File and archive events use
        generic labels; never expose historical filenames, archive paths or unknown raw details.
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - *a3
        - *a4
      responses:
        "200":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                required:
                  - activity
                  - pagination
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
                  pagination: *a5
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
  /api/v1/cards/{id}/attachments:
    get:
      tags:
        - Anhänge
      operationId: listCardAttachments
      summary: Sichtbare Anhänge auflisten
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - *a3
        - *a4
      responses:
        "200":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                required:
                  - attachments
                  - pagination
                properties:
                  attachments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Attachment"
                  pagination: *a5
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
    post:
      tags:
        - Anhänge
      operationId: uploadCardAttachment
      summary: Anhang hochladen
      description: Write scope; enabled attachment field. Exactly one file and kind. Max 25 MiB, PDF
        except student_card also PNG/JPEG. Named slots replace existing files; other appends.
        Storage and rollback cleanup follow the card lock. Inventory system boards are read-only.
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
                - file
                - kind
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  type: string
                  enum:
                    - finance_request
                    - annex_a
                    - annex_b
                    - student_card
                    - other
      responses:
        "201":
          description: Erfolgreich.
          content:
            application/json:
              schema:
                type: object
                required:
                  - attachment
                properties:
                  attachment:
                    $ref: "#/components/schemas/Attachment"
        "400": *a2
        "401": *a2
        "403": *a2
        "404": *a2
        "409": *a2
        "413": *a2
  /api/v1/cards/{id}/attachments/{attachmentId}:
    get:
      tags:
        - Anhänge
      operationId: downloadCardAttachment
      summary: Sichtbaren Anhang herunterladen
      parameters:
        - name: id
          in: path
          required: true
          schema: *a1
        - name: attachmentId
          in: path
          required: true
          schema: *a1
      responses:
        "200":
          description: Binary attachment with no-store and safe Content-Disposition.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        "401": *a2
        "404": *a2
  /api/v1:
    get:
      tags:
        - Allgemein
      operationId: getApiInfo
      summary: API-Information
      description: >-
        Bestätigt den Token und listet die verfügbaren Endpunkte. Nützlich, um Token, Rechtestufe
        und Board-Beschränkung zu prüfen.


        **Berechtigung:** jeder gültige Token.
      responses:
        "200":
          description: Token gültig.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiInfo"
        "401": &a7
          description: "Kein oder ungültiger API-Token. Der Header `Authorization: Bearer …` fehlt, ist
            fehlerhaft, der Token wurde widerrufen oder das Konto ist deaktiviert."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Ungültiger oder fehlender API-Token.
                hint: "Header 'Authorization: Bearer grm_…' setzen."
  /api/v1/boards:
    get:
      tags:
        - Boards
      operationId: listBoards
      summary: Zugängliche Boards auflisten
      description: >-
        Alle Boards, die der Token-Nutzer sehen darf: eigene Boards, direkte Freigaben, Freigaben
        über eine Gruppe und — bei Administratoren — alle Boards. Ein auf bestimmte Boards
        beschränkter Token sieht nur die Schnittmenge.


        **Berechtigung:** Board-Zugriff des Nutzers (`canAccessBoard`).
      responses:
        "200":
          description: Liste der zugänglichen Boards.
          content:
            application/json:
              schema:
                type: object
                required:
                  - boards
                properties:
                  boards:
                    type: array
                    items:
                      $ref: "#/components/schemas/Board"
        "401": *a7
  /api/v1/boards/{id}:
    get:
      tags:
        - Boards
      operationId: getBoard
      summary: Board mit Spalten und sichtbaren Feldern
      description: >-
        Board, seine Status-Spalten (nach `position`) und die am Board **aktivierten** Kartenfelder.


        **Berechtigung:** Board-Zugriff. `isInstructionTrigger`, `isTransferTrigger`,
        `isReceiptTrigger` an den Spalten sowie `ownerId`, `receiptToStatusId`, `resubmitStatusId`
        am Board erscheinen nur für Board-Verwalter (Eigentümer oder Administrator). Mehrere Spalten
        können Archiv- und Quittungs-Auslöser sein.
      parameters:
        - name: id
          in: path
          required: true
          description: Board-ID.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "200":
          description: Board, Spalten und aktivierte Kartenfelder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoardDetail"
        "401": *a7
        "404": &a18
          description: Board nicht gefunden — **oder** der Nutzer hat keinen Zugriff darauf, **oder** der
            Token ist auf andere Boards beschränkt. Bewusst identisch, damit die Existenz fremder
            Boards nicht preisgegeben wird.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Board nicht gefunden.
  /api/v1/boards/{id}/cards:
    get:
      tags:
        - Karten
      operationId: listBoardCards
      summary: Karten eines Boards auflisten
      description: >-
        Karten des Boards, sortiert nach Spalten- und Kartenposition. Am Board **deaktivierte**
        Felder werden nicht ausgeliefert — die API zeigt nie mehr als die Weboberfläche.


        **Berechtigung:** Board-Zugriff.
      parameters:
        - name: id
          in: path
          required: true
          description: Board-ID.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: statusId
          in: query
          required: false
          description: Nur Karten dieser Spalte. Ungültige oder außerhalb des int32-Bereichs liegende Werte
            ergeben 400.
          schema:
            type: integer
            format: int32
            minimum: 1
        - name: archived
          in: query
          required: false
          description: Archivierte (weggeräumte) Karten. Ohne Angabe werden **nur aktive** Karten geliefert;
            `true` liefert **nur** archivierte, `all` beide.
          schema:
            type: string
            enum:
              - "false"
              - "true"
              - all
        - *a3
        - *a4
        - *a8
        - *a9
        - *a10
        - *a11
        - *a12
        - *a13
        - *a14
        - *a15
        - *a16
        - *a17
      responses:
        "200":
          description: Karten des Boards.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
              example:
                cards:
                  - id: 42
                    budgetMode: single
                    budgetRevision: 0
                    boardId: 1
                    statusId: 10
                    statusName: Eingegangen
                    position: 0
                    title: Grillabend am FB5
                    locationId: 4
                    archivedAt: null
                    createdAt: 2026-01-02T10:15:00.000Z
                    updatedAt: 2026-01-02T10:15:00.000Z
                    applicant: Max Mustermann
                    number: A_0042_2026
                    priorityId: 3
                    assigneeUserIds: &a19
                      - 7
                    deadline: 2026-02-01
                    approvedAmountCents: 25000
                    notes: null
        "400": &a20
          description: "Ungültige Eingabe: kaputtes JSON, unbekanntes Body-Feld, Schema-Verstoß, ein am Board
            **deaktiviertes** Feld, eine nicht zum Board gehörende `statusId`, eine unbekannte
            `priorityId`/`accountId`, ein Nutzer ohne Board-Zugriff oder `archived: true` (manuelles
            Archivieren gibt es nicht)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
              examples:
                schema:
                  summary: Schema-Verstoß
                  value:
                    error: Ungültige Eingabe.
                    issues:
                      - path: title
                        message: String must contain at least 1 character(s)
                fieldDisabled:
                  summary: Feld am Board deaktiviert
                  value:
                    error: Feld 'budgetTitle' ist auf diesem Board nicht aktiviert.
        "401": *a7
        "404": *a18
    post:
      tags:
        - Karten
      operationId: createCard
      summary: Karte auf einem Board anlegen
      description: >-
        Legt eine Karte an. Pflichtfeld ist `title`. Ohne `statusId` landet sie in der **ersten**
        Spalte, ohne `position` am Ende der Spalte. Ist die Board-Nummerierung aktiv, wird
        automatisch eine Antragsnummer vergeben.


        **Berechtigung:** Board-Zugriff **und** Token mit `scope=write`. Alle aktivierten
        Kartenfelder einschließlich `number`, `instructionDate` und `transferDate` dürfen
        geschrieben werden. Am Board deaktivierte Felder werden abgelehnt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCreate"
            examples:
              minimal:
                summary: Nur Titel
                value:
                  title: Grillabend am FB5
              mitFeldern:
                summary: Mit weiteren Feldern
                value:
                  title: Grillabend am FB5
                  applicant: Max Mustermann
                  priorityId: 3
                  deadline: 2026-02-01
                  approvedAmountCents: 25000
      responses:
        "201":
          description: Karte angelegt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardEnvelope"
              example:
                card: &a22
                  id: 42
                  budgetMode: single
                  budgetRevision: 0
                  boardId: 1
                  statusId: 10
                  position: 0
                  title: Grillabend am FB5
                  locationId: 4
                  archivedAt: null
                  createdAt: 2026-01-02T10:15:00.000Z
                  updatedAt: 2026-01-02T10:15:00.000Z
                  applicant: Max Mustermann
                  number: A_0042_2026
                  priorityId: 3
                  assigneeUserIds: *a19
                  deadline: 2026-02-01
                  approvedAmountCents: 25000
                  notes: null
                budgetPositions: []
        "400": *a20
        "401": *a7
        "403": &a23
          description: "Schreibzugriff verweigert: Der Token hat nur Lese-Rechte (`scope=read`)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                readOnly:
                  summary: Token nur lesend
                  value:
                    error: Dieser Token hat nur Lese-Rechte (scope=read).
        "404": *a18
        "409": &a25
          description: "Leihvorgang-Board: Dessen Karten werden ausschließlich über das Inventar verwaltet,
            die API ist dort nur lesend."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: "Leihvorgang-Board: Karten werden über das Inventar verwaltet (API nur lesend)."
  /api/v1/me/cards:
    get:
      tags:
        - Karten
      operationId: listMyCards
      summary: Mir zugewiesene Karten auflisten
      description: >-
        Alle dem Token-Nutzer **zugewiesenen** Karten board-übergreifend, inklusive `boardName` und
        `statusName`. Beschränkt auf die zugänglichen (und vom Token erlaubten) Boards; deaktivierte
        Felder werden je Board ausgeblendet.


        **Berechtigung:** jeder gültige Token; die Ergebnismenge folgt den Board-Zugriffen des
        Nutzers.
      parameters: *a21
      responses:
        "200":
          description: Zugewiesene Karten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardList"
              example:
                cards:
                  - id: 42
                    budgetMode: single
                    budgetRevision: 0
                    boardId: 1
                    statusId: 10
                    statusName: Eingegangen
                    position: 0
                    title: Grillabend am FB5
                    locationId: 4
                    archivedAt: null
                    createdAt: 2026-01-02T10:15:00.000Z
                    updatedAt: 2026-01-02T10:15:00.000Z
                    applicant: Max Mustermann
                    number: A_0042_2026
                    priorityId: 3
                    assigneeUserIds: *a19
                    deadline: 2026-02-01
                    approvedAmountCents: 25000
                    notes: null
                    boardName: Antragsboard
        "400": *a20
        "401": *a7
  /api/v1/cards/{id}:
    get:
      tags:
        - Karten
      operationId: getCard
      summary: Karte abrufen
      description: |-
        Einzelne Karte inklusive `statusName` und `boardName`.

        **Berechtigung:** Zugriff auf das Board der Karte.
      parameters:
        - name: id
          in: path
          required: true
          description: Karten-ID.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "200":
          description: Karte.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardEnvelope"
              example:
                card:
                  id: 42
                  budgetMode: single
                  budgetRevision: 0
                  boardId: 1
                  statusId: 10
                  statusName: Eingegangen
                  position: 0
                  title: Grillabend am FB5
                  locationId: 4
                  archivedAt: null
                  createdAt: 2026-01-02T10:15:00.000Z
                  updatedAt: 2026-01-02T10:15:00.000Z
                  applicant: Max Mustermann
                  number: A_0042_2026
                  priorityId: 3
                  assigneeUserIds: *a19
                  deadline: 2026-02-01
                  approvedAmountCents: 25000
                  notes: null
                  boardName: Antragsboard
                budgetPositions: []
        "401": *a7
        "404": &a24
          description: Karte nicht gefunden — **oder** kein Zugriff auf ihr Board, **oder** der Token ist auf
            andere Boards beschränkt.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: Karte nicht gefunden.
    patch:
      tags:
        - Karten
      operationId: updateCard
      summary: Karte ändern oder verschieben
      description: >-
        Ändert die übergebenen Felder; nicht übergebene bleiben unberührt, `null` löscht ein Feld.


        **Verschieben:** `statusId` setzen — die Karte landet am Ende der Zielspalte, ein
        Aktivitätseintrag entsteht und die Trigger (Anweisungsdatum, Überweisungsdatum,
        Nextcloud-Archiv) greifen wie in der Oberfläche. Ein Statuswechsel setzt
        Nachreichungsmarkierung und Done-Archivierungsfrist entsprechend zurück. Mit zusätzlichem
        `position` wird an eine bestimmte Stelle einsortiert.


        **Wiederherstellen:** `archived: false` holt eine weggeräumte Karte zurück. `archived: true`
        wird mit `400` abgelehnt — manuelles Archivieren gibt es auch im Web nicht.


        **Berechtigung:** Board-Zugriff **und** `scope=write`; alle aktivierten Kartenfelder
        einschließlich `number`, `instructionDate` und `transferDate` dürfen geändert werden.
      parameters:
        - name: id
          in: path
          required: true
          description: Karten-ID.
          schema:
            type: integer
            format: int32
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardWrite"
            examples:
              verschieben:
                summary: In Spalte 12 an zweite Position
                value:
                  statusId: 12
                  position: 1
              feldLoeschen:
                summary: Deadline entfernen
                value:
                  deadline: null
              wiederherstellen:
                summary: Archivierte Karte zurückholen
                value:
                  archived: false
      responses:
        "200":
          description: Karte geändert.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardEnvelope"
              example:
                card: *a22
                budgetPositions: []
        "400": *a20
        "401": *a7
        "403": *a23
        "404": *a24
        "409": *a25
    delete:
      tags:
        - Karten
      operationId: deleteCard
      summary: Karte löschen
      description: >-
        Löscht die Karte und ihre Anhänge (Dateien inklusive). Unwiderruflich.


        **Berechtigung:** Board-Zugriff **und** `scope=write`. Das Zugriffsmodell ist binär — jedes
        Board-Mitglied darf löschen, ein gesondertes Löschrecht gibt es nicht.
      parameters:
        - name: id
          in: path
          required: true
          description: Karten-ID.
          schema:
            type: integer
            format: int32
            minimum: 1
      responses:
        "200":
          description: Karte gelöscht.
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
                    const: true
              example:
                ok: true
        "401": *a7
        "403": *a23
        "404": *a24
        "409": *a25
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API-Token
      description: >-
        Persönlicher API-Token aus **Mein Konto → API-Tokens**, gesendet als `Authorization: Bearer
        grm_…`.


        Der Token gilt nur im Rahmen der Rechte seines Nutzers. Die Anmeldung an dieser
        Dokumentationsseite ersetzt ihn **nicht**.
  schemas:
    Pagination: *a5
    Comment:
      type: object
      required:
        - id
        - body
        - userId
        - createdAt
      properties:
        id: *a1
        cardId: *a1
        body:
          type: string
        userId:
          type:
            - integer
            - "null"
        authorName:
          type:
            - string
            - "null"
        authorUsername:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
    Activity:
      type: object
      required:
        - id
        - userId
        - type
        - detail
        - createdAt
      properties:
        id: *a1
        userId:
          type:
            - integer
            - "null"
        type:
          type: string
        detail:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
    Attachment:
      type: object
      required:
        - id
        - cardId
        - kind
        - filename
        - mime
        - size
        - uploadedAt
        - uploadedBy
        - downloadPath
      properties:
        id: *a1
        cardId: *a1
        kind:
          type: string
          enum:
            - finance_request
            - annex_a
            - annex_b
            - student_card
            - other
        filename:
          type: string
        mime:
          type: string
        size:
          type: integer
        uploadedAt:
          type: string
          format: date-time
        uploadedBy:
          type:
            - integer
            - "null"
        downloadPath:
          type: string
          description: Bearer-protected relative API download path; not a public URL.
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Lesbare Fehlermeldung.
        hint:
          type: string
          description: Optionaler Hinweis zur Behebung (nur bei 401).
    ValidationError:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        issues:
          type: array
          description: Feldbezogene Verstöße (nur bei Schema-Fehlern).
          items:
            type: object
            required:
              - path
              - message
            properties:
              path:
                type: string
                description: Punktnotation des Feldes, z. B. `title`.
              message:
                type: string
    ApiInfo:
      type: object
      required:
        - api
        - version
        - authenticatedAs
        - token
        - endpoints
      properties:
        api:
          type: string
          examples:
            - Gremio API
        version:
          type: string
          examples:
            - v1
        authenticatedAs:
          type: object
          required:
            - id
            - username
            - role
          properties:
            id:
              type: integer
              format: int32
            username:
              type: string
            role:
              type: string
              enum:
                - admin
                - template_manager
                - user
        token:
          type: object
          required:
            - scope
            - boards
          properties:
            scope:
              type: string
              enum:
                - read
                - write
              description: Rechtestufe des Tokens.
            boards:
              description: "Board-Beschränkung: Liste der erlaubten IDs oder der Text `all`."
              oneOf:
                - type: array
                  items:
                    type: integer
                    format: int32
                - type: string
                  const: all
        endpoints:
          type: object
          description: Pfad → Kurzbeschreibung.
          additionalProperties:
            type: string
    Board:
      type: object
      required:
        - id
        - name
        - description
        - role
        - doneStatusId
        - createdAt
      properties:
        id:
          type: integer
          format: int32
        name:
          type: string
        description:
          type:
            - string
            - "null"
        ownerId:
          type: integer
          format: int32
          description: Nur für Board-Verwalter (Eigentümer/Administrator) enthalten — sonst fehlt das Feld ganz.
        role:
          type: string
          enum:
            - owner
            - admin
            - member
          description: Rolle des Token-Nutzers bezogen auf dieses Board.
        doneStatusId:
          type:
            - integer
            - "null"
          format: int32
          description: Spalte, die vom Done-Sweep archiviert wird (null = aus).
        receiptToStatusId:
          type:
            - integer
            - "null"
          format: int32
          description: Zielspalte nach Quittungseinreichung; null = aus. Nur für Board-Verwalter enthalten.
        resubmitStatusId:
          type:
            - integer
            - "null"
          format: int32
          description: Spalte für Nachreichungen; null = aus. Nur für Board-Verwalter enthalten.
        createdAt:
          type: string
          format: date-time
    BoardStatus:
      type: object
      required:
        - id
        - name
        - position
